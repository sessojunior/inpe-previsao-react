server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # As rotas da aplicacao sao tratadas pelo React no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets gerados pelo Vite possuem hash e podem ser armazenados por longo prazo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
